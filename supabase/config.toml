# Supabase CLI settings for the finance project (ref kedxsjrbnrffrzdoyveh).
# Only what the edge function deploy needs; the database is managed through
# supabase/migrations and the hand-mirrored supabase/schema/schema.sql.
project_id = "kedxsjrbnrffrzdoyveh"

[functions.sync-feeds]
